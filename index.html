<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Large Text Area</title>
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #030712;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 2rem;
      color: #e2e8f0;
    }

    .app-shell {
      width: min(960px, 100%);
      background: #0f172a;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 30px 80px rgba(2, 6, 23, 0.65);
      border: 1px solid rgba(148, 163, 184, 0.15);
    }

    h1 {
      margin: 0 0 1rem;
      font-size: 1.75rem;
      color: #f8fafc;
    }

    p {
      margin: 0 0 1.5rem;
      color: #94a3b8;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #cbd5f5;
    }

    textarea {
      width: 100%;
      min-height: 420px;
      padding: 1.25rem;
      font-size: 1rem;
      line-height: 1.5;
      border-radius: 14px;
      border: 1px solid rgba(59, 130, 246, 0.35);
      resize: vertical;
      box-shadow: inset 0 8px 24px rgba(15, 23, 42, 0.75);
      box-sizing: border-box;
      background: #020617;
      color: #f8fafc;
      caret-color: #60a5fa;
    }

    textarea:focus {
      outline: 3px solid rgba(59, 130, 246, 0.55);
      border-color: rgba(59, 130, 246, 1);
    }

    textarea::placeholder {
      color: rgba(226, 232, 240, 0.55);
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <h1>Write Anything</h1>
    <p>Use the large text area below to jot down notes, draft ideas, or paste long-form content.</p>
    <label for="big-text-area">Your text</label>
    <textarea id="big-text-area" placeholder="Start typing here..."></textarea>
  </main>
</body>
</html>
