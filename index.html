<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Large Text Area</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 2rem;
    }

    .app-shell {
      width: min(960px, 100%);
      background: white;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.2);
      border: 1px solid rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 1rem;
      font-size: 1.75rem;
      color: #0f172a;
    }

    p {
      margin: 0 0 1.5rem;
      color: #475569;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #1e293b;
    }

    textarea {
      width: 100%;
      min-height: 420px;
      padding: 1.25rem;
      font-size: 1rem;
      line-height: 1.5;
      border-radius: 14px;
      border: 1px solid rgba(15, 23, 42, 0.15);
      resize: vertical;
      box-shadow: inset 0 2px 8px rgba(15, 23, 42, 0.08);
      box-sizing: border-box;
    }

    textarea:focus {
      outline: 3px solid rgba(59, 130, 246, 0.35);
      border-color: rgba(59, 130, 246, 0.9);
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <h1>Write Anything</h1>
    <p>Use the large text area below to jot down notes, draft ideas, or paste long-form content.</p>
    <label for="big-text-area">Your text</label>
    <textarea id="big-text-area" placeholder="Start typing here..."></textarea>
  </main>
</body>
</html>
